# rnx2rtkp configuration for static ground-test RTK post-processing
# (antenna stationary -- e.g. a calibration/validation session, as opposed to
# an actual drone flight; see conf/rtk_kinematic.conf for that case).
#
# Usage:
#   rnx2rtkp -k conf/rtk_static.conf rover.obs base.obs base.nav -o rtk.pos
#
# rover.obs  : RINEX 3 from pocket_obs2rnx.py (L1CA + L2CM, GPS + QZSS)
# base.obs   : CORS RINEX from Geoscience Australia (https://gnss.ga.gov.au/rinex/)
#              Station: STR1 (Mount Stromlo/Canberra) or TID1 (Tidbinbilla)
# base.nav   : RINEX NAV from the same CORS download, or rover.nav from
#              pocket_eph2rnx.py (self-generated, no internet needed)
#
# Differences from rtk_kinematic.conf, and why:
#   pos1-posmode =static (not kinematic): treats position as a single fixed
#     unknown and averages down noise over the whole session, instead of
#     letting a dynamics filter track epoch-to-epoch scatter as if it were
#     real motion. On a real static test this alone took fixed-epoch count
#     from 0 (kinematic) to 50 (static) and formal sigma converged from
#     ~15-27m to ~7-30cm over the session.
#   pos1-dynamics=off: no velocity/acceleration states needed for a static
#     antenna.
#   pos1-elmask=25 (not 15): empirically, raising the mask from 15 to 25 deg
#     on a real static session here cut fixed-epoch RMS from 2.2m to 0.61m
#     (at the cost of fewer fixed epochs, 29 vs 50) -- a clear sign of
#     low-elevation multipath (e.g. non-choke-ring antenna, reflective
#     surfaces nearby) rather than just thinner geometry. Re-tune per site;
#     if your antenna/site has less multipath exposure, 15-20 may do fine and
#     keep more satellites in view.

pos1-posmode   =static
pos1-frequency =2           # L1+L2 dual frequency (numeric form: this Ubuntu
                             # rtklib package, 2.4.3.b34+dfsg-1, predates the
                             # "l1+l2" string spelling)
pos1-soltype   =combined    # forward + backward combined (best for post-proc)
pos1-elmask    =25          # see note above -- tune per site/antenna
pos1-dynamics  =off         # static: no velocity/acceleration states
pos1-tidecorr  =off
pos1-ionoopt   =dual-freq   # iono-free dual-freq combination (was "iflc", the
                             # internal C enum name, not the .conf file token)
pos1-tropopt   =saas        # Saastamoinen troposphere model
pos1-sateph    =brdc        # broadcast ephemeris (use precise if SP3 available)
pos1-exclsats  =S59,S60     # PocketSDR's own AOWR pseudo-satellite (-ps_prn
                             # 159): a ground-transmitter range logged as a
                             # fake SBAS satellite, not real GNSS geometry --
                             # blows up the point-position chi-square test and
                             # silently kills every epoch if left in. pocket_
                             # obs2rnx.py excludes it by default now too, but
                             # this is a harmless second line of defense for
                             # rover.obs files generated before that fix.
pos1-navsys    =17          # GPS(1) + QZSS(16) summed as a plain integer --
                             # "1+16" silently parses as just "1" (GPS only),
                             # no error reported, same bug as pos1-frequency

ant2-postype   =rinexhead   # THE critical one: use the CORS base's own
                             # surveyed position from its RINEX header. Without
                             # this, the base position silently defaults to
                             # (6378137,0,0) -- WGS84 equatorial radius at
                             # lat=lon=0 -- making every satellite compute as
                             # below the horizon from the base, which fails
                             # the elevation mask for 100% of satellites and
                             # kills every single epoch with "no common
                             # satellite", with no other error reported.

pos2-armode    =continuous  # ambiguity resolution: continuous
pos2-gloarmode =off         # no GLONASS AR (not in rover signal set)
pos2-arthres   =3.0         # AR ratio threshold
pos2-arlockcnt =5           # min lock count before AR
pos2-aroutcnt  =5           # reset AR after this many outlier epochs
pos2-arminfix  =10          # min fix epochs before accepting solution
pos2-slipthres =0.05        # cycle slip threshold (m)
pos2-maxage    =30          # max age of differential (s)
pos2-rejionno  =30          # innovation outlier gate (m)
pos2-niter     =1

out-solformat  =llh         # latitude/longitude/height output
out-outhead    =on
out-outopt     =on
out-timesys    =gpst        # GPS time
out-timeform   =hms         # calendar date/time -- required: pocket_pos_plot.py
                             # and pocket_rtk_compare.py only parse this form
                             # (week/tow output isn't recognized and silently
                             # produces "no $POS records / No valid data")
out-timendec   =3           # 3 decimal places (ms)
out-degform    =deg         # degrees for lat/lon
out-fieldsep   =            # space separator
out-height     =ellipsoidal # WGS-84 ellipsoidal height (same as PPP output)
out-geoid      =internal
out-solstatic  =all
