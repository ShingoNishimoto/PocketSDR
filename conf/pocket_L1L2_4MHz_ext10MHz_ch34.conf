#
#  Pocket SDR device settings — CH3=L1, CH4=L2 (CH1/CH2 hardware failed)
#
#  CH1/CH2 are non-functional: FX3 GPIF byte0 (CH1+CH2 I/Q lines) stuck HIGH.
#  CH1 is configured so its PLL runs and CLKOUT drives ADC_CLK_AB for CH3/CH4.
#  CH2 is configured for completeness; its data is discarded.
#  CH3 (rfch2) = L1 at 1575.420 MHz — active data channel.
#  CH4 (rfch3) = L2 at 1227.600 MHz — active data channel.
#
#  PLL (F_LO = F_XTAL/RDIV * (NDIV + FDIV/2^20), F_XTAL = 10.0 MHz):
#    CH1: 10/1 * (157 + 568328/1048576) = 1575.419998 MHz (error ~2 Hz, PFD=10MHz)
#    CH2: 10/1 * (122 + 796918/1048576) = 1227.600002 MHz (error ~2 Hz, PFD=10MHz)
#    CH3: same PLL as CH1 → 1575.419998 MHz
#    CH4: same PLL as CH2 → 1227.600002 MHz
#
#  ADC clock:
#    CH1: EXTADCCLK=0, PREFRACDIV 2730/6825=2/5 → 10*2/5*2=8.000 MHz → 4.000 Msps IQ
#    CH3: EXTADCCLK=1 (uses CH1 CLKOUT=8 MHz) → 4.000 Msps IQ
#    CH4: EXTADCCLK=1 (uses CH1 CLKOUT=8 MHz) → 4.000 Msps IQ
#
#  Streamer usage:
#    zmq_streamer --conf-file <this file> --conf-num-ch 4 --l1-ch 2 --l2-ch 3
#

[CH1]
LNAMODE         =       0  # LNA mode selection (0:high-band,1:low-band,2:disable)
MIXERMODE       =       0  # Mixer mode selection (0:high-band,1:low-band,2:disable)
LOBAND          =       0  # Local oscillator band selection (0:L1,1:L2/L5)
FCEN            =       0  # IF filter center frequency: (128-FCEN)/2*{0.195|0.66|0.355} MHz
FBW             =       0  # IF filter BW (0:2.5MHz,1:8.7MHz,2:4.2MHz,3:23.4MHz,4:36MHz,7:16.4MHz)
F3OR5           =       0  # Filter order selection (0:5th,1:3rd)
FCENX           =       0  # Polyphase filter selection (0:lowpass,1:bandpass)
FGAIN           =       1  # IF filter gain setting (0:-6dB,1:normal)
IQEN            =       1  # I and Q channel enable (0:I-CH-only,1:I/Q-CH)
GAINREF         =     170  # AGC gain reference value (0-4095)
AGCMODE         =       0  # AGC mode control (0:independent-I/Q,2:gain-set-by-GAININ)
GAININ          =      58  # PGA gain value programming in steps of approx 1dB per LSB (0-63)
FHIPEN          =       0  # Enable of highpass coupling between filter and PGA (0:disable,1:enable)
PGAIEN          =       1  # I-CH PGA enable (0:disable,1:enable)
PGAQEN          =       1  # Q-CH PGA enable (0:disable,1:enable)
INT_PLL         =       0  # PLL mode control (0:fractional-N,1:integer-N)
NDIV            =     157  # PLL integer division ratio: F_LO=F_XTAL/RDIV*(NDIV+FDIV/2^20)
RDIV            =       1  # PLL reference division ratio (1-1023)
FDIV            =  568328  # PLL fractional division ratio (0-1048575)
EXTADCCLK       =       0  # Internal clock; CLKOUT output drives ADC_CLK_AB for CH3/CH4
PREFRACDIV_SEL  =       1  # Clock pre-divider selection (0:bypass,1:enable)
REFCLK_L_CNT    =    2730  # Clock pre-divider L counter value: L_CNT/(4096-M_CNT+L_CNT)
REFCLK_M_CNT    =       1  # Clock pre-divider M counter value
ADCCLK          =       0  # Integer clock div/mul selection (0:enable,1:bypass)
REFDIV          =       0  # Integer clock div/mul ratio (0:x2,1:1/4,2:1/2,3:x1,4:x4) -> x2
FCLKIN          =       0  # ADC clock divider selection (0:bypass,1:enable)
ADCCLK_L_CNT    =       0  # ADC clock divider L counter value (0-4095)
ADCCLK_M_CNT    =       0  # ADC clock divider M counter value (0-4095)

[CH2]
LNAMODE         =       1  # LNA mode selection (0:high-band,1:low-band,2:disable)
