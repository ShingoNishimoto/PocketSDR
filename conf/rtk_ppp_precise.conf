# rnx2rtkp configuration for drone kinematic PPP offline reprocessing with
# precise ephemeris (rapid-precise SP3+CLK or ultra-rapid SP3), -clkfix'd to
# an AOWR-derived clock offset series. See CLAUDE.md's "Offline PPP
# reprocessing with RTKLIB_fork" section for background on clock_bias_fixed
# and the silent-failure traps this file's settings avoid (pos1-tropopt must
# be est-ztdgrad not estg; pos1-navsys must be the literal sum 125; maxinno
# match requires both pos2-rejionno and pos2-rejcode).
#
# Usage:
#   rnx2rtkp -k conf/rtk_ppp_precise.conf rover.obs rover.nav <sp3> [<clk>] \
#       -clkfix <clk_file> -o main_precise.pos
#   (drop the sp3/clk args and swap pos1-sateph=brdc for a broadcast-
#    ephemeris run against the same rover.obs/rover.nav -- see
#    rtk_ppp_brdc.conf)

pos1-posmode   =ppp-kine
pos1-frequency =2
pos1-soltype   =combined
pos1-elmask    =15
pos1-dynamics  =on
pos1-tidecorr  =off
stats-prnaccelh=0.0005
stats-prnaccelv=0.0002
pos1-ionoopt   =dual-freq
pos1-tropopt   =est-ztdgrad
pos1-sateph    =precise
pos1-exclsats  =S59,S60
pos1-navsys    =125
pos2-armode    =continuous
pos2-gloarmode =off
pos2-arthres   =3.0
pos2-arlockcnt =5
pos2-aroutcnt  =5
pos2-arminfix  =10
pos2-slipthres =0.05
pos2-maxage    =30
pos2-rejionno  =100
pos2-rejcode   =100
pos2-niter     =1
out-solformat  =llh
out-outhead    =on
out-outopt     =on
out-timesys    =gpst
out-timeform   =hms
out-timendec   =3
out-degform    =deg
out-fieldsep   =
out-height     =ellipsoidal
out-geoid      =internal
out-solstatic  =all
