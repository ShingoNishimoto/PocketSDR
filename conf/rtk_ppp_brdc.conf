# rnx2rtkp configuration for drone kinematic PPP offline reprocessing with
# broadcast ephemeris, -clkfix'd to an AOWR-derived clock offset series --
# same settings as rtk_ppp_precise.conf except pos1-sateph=brdc and no
# sp3/clk input files, for an apples-to-apples ephemeris-type comparison
# against rtk_ppp_precise.conf using the same clock input.
#
# Usage:
#   rnx2rtkp -k conf/rtk_ppp_brdc.conf rover.obs rover.nav \
#       -clkfix <clk_file> -o main_brdc.pos

pos1-posmode   =ppp-kine
pos1-frequency =2
pos1-soltype   =combined
pos1-elmask    =15
pos1-dynamics  =on
pos1-tidecorr  =off
stats-prnaccelh=0.0005
stats-prnaccelv=0.0002
pos1-ionoopt   =dual-freq
pos1-tropopt   =est-ztdgrad
pos1-sateph    =brdc
pos1-exclsats  =S59,S60
pos1-navsys    =125
pos2-armode    =continuous
pos2-gloarmode =off
pos2-arthres   =3.0
pos2-arlockcnt =5
pos2-aroutcnt  =5
pos2-arminfix  =10
pos2-slipthres =0.05
pos2-maxage    =30
pos2-rejionno  =100
pos2-rejcode   =100
pos2-niter     =1
out-solformat  =llh
out-outhead    =on
out-outopt     =on
out-timesys    =gpst
out-timeform   =hms
out-timendec   =3
out-degform    =deg
out-fieldsep   =
out-height     =ellipsoidal
out-geoid      =internal
out-solstatic  =all
