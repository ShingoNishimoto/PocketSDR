#
#  Test conf: CH2 configured for GPS L1CA to isolate CH1 hardware failure.
#  Connect GPS simulator (or antenna) to CH2 SMA port.
#  CH1 must still be configured to generate the 10 MHz -> 4 MHz ADC clock
#  (CH2 uses CH1's CLKOUT via EXTADCCLK=1).
#
#  Usage:
#    POCKET_SDR_TCXO_KHZ=10000 pocket_dump -c conf/test_ch2_L1CA.conf -f 4 -t 10 ch1.bin ch2.bin
#    pocket_acq -sig L1CA -prn 1-32 ch2.bin
#

[CH1]
LNAMODE         =       0
MIXERMODE       =       0
LOBAND          =       0
FCEN            =       0
FBW             =       0
F3OR5           =       0
FCENX           =       0
FGAIN           =       1
IQEN            =       1
GAINREF         =     170
AGCMODE         =       0
GAININ          =      58
FHIPEN          =       0
PGAIEN          =       1
PGAQEN          =       1
INT_PLL         =       0
NDIV            =     157
RDIV            =       1
FDIV            =  568328
EXTADCCLK       =       0
PREFRACDIV_SEL  =       1
REFCLK_L_CNT    =    2730
REFCLK_M_CNT    =       1
ADCCLK          =       0
REFDIV          =       0
FCLKIN          =       0
ADCCLK_L_CNT    =       0
ADCCLK_M_CNT    =       0

[CH2]
LNAMODE         =       0
MIXERMODE       =       0
LOBAND          =       0
FCEN            =       0
FBW             =       0
F3OR5           =       0
FCENX           =       0
FGAIN           =       1
IQEN            =       1
GAINREF         =     170
AGCMODE         =       0
GAININ          =      58
FHIPEN          =       0
PGAIEN          =       1
PGAQEN          =       1
INT_PLL         =       0
NDIV            =     157
RDIV            =       1
FDIV            =  568328
EXTADCCLK       =       1
