# PocketSDR options for L1CA+L2CM dual-frequency PPP kinematic (drone)

el_mask = 15 # for outdoor test around Birch
maxgdop = 2000.0  # GDOP reject threshold (default 30.0; increase for cislunar where geometry is poor)

# L1CA parameters (at or near defaults)
thres_cn0_l = 34.0   # L1CA acquisition CN0 threshold dB-Hz (default)
thres_cn0_u = 30.0   # L1CA loss-of-lock CN0 threshold dB-Hz (default)

# L2CM-specific overrides (applied only to L2* signals)
t_acq_L2        = 0.1    # 5 L2CM code integrations for acquisition (default 0.02 = 1 code)
t_dll_L2        = 0.1    # 5 L2CM code integrations for DLL (default 0.02 = 1 code)
thres_cn0_l_L2  = 28.0   # L2CM acquisition CN0 threshold dB-Hz (default 34.0 too high)
thres_cn0_u_L2  = 25.0   # L2CM loss-of-lock CN0 threshold dB-Hz

# Loop filter bandwidths (applied to all signals)
b_pll       = 3.0    # PLL bandwidth Hz (default 5.0)
b_fll_n     = 1.0    # steady-state FLL bandwidth Hz (default 2.0)

# Dynamics model: position/velocity/acceleration state (required for kinematic PPP)
# Without this, position is re-initialized from SPP every epoch and never converges.
dynamics    = 1

# Acceleration process noise (m/s²): sized for a drone doing ~1-2 m/s² maneuvers.
# Increase (e.g. 2.0 / 1.0) for aggressive flight; decrease for slow hover.
prnaccelh   = 0.0005    # horizontal
prnaccv     = 0.0002    # vertical

# For pseudo-satellite signal from bladeRF (frequency error -7.15 mHz)
ps_freq_err = -7.15e-3

# SC antenna attitude for cislunar simulation.
# From cislunar distance, all GNSS satellites appear below the standard ENU
# horizon (negative elevation). A nadir-pointing antenna (boresight toward
# Earth center) sees them at positive elevation in the antenna frame.
# sc_ant_fix=1 rotates the satellite LOS into the antenna frame before applying
# the elevation mask in satazel(), covering pntpos, pppos, and acquisition.
sc_ant_fix = 1
sc_ant_az  = 0.0    # boresight azimuth (deg)
sc_ant_el  = 90.0  # boresight elevation (deg, -90 = nadir)
