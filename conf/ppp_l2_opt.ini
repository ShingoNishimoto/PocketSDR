# PocketSDR options for L1CA+L2CM dual-frequency PPP
# L2CM weak signal tuning

t_dll       = 0.1    # non-coherent DLL integration (N=5 x 20ms for L2CM, N=100 x 1ms for L1CA)
b_pll       = 3.0    # PLL bandwidth Hz (default 5.0)
b_fll_n     = 1.0    # steady-state FLL bandwidth Hz (default 2.0)
thres_cn0_u = 27.0   # loss-of-lock CN0 threshold dB-Hz (default 30.0)
